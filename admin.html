<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#CFE5FB">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data:; connect-src https://fra.cloud.appwrite.io; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Administration · Conductrice Fashion</title>
<style>
/* ===== Couleurs (modèle Afrilova) : bleu clair, or, gris très clair, blanc ===== */
:root{--side:#CFE5FB;--ink:#17406B;--gold:#D6B15E;--gold2:#B8923A;--bg:#F3F5F9;--card:#fff;--line:#E3E8F0;--mut:#6B7C93;--danger:#D64545;--ok:#2E9E6B;--haut:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:#1d2b3a;min-height:100vh;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.muted{color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=password],input[type=search],input[type=number],textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
input:disabled{background:#eef0f4}
textarea{min-height:90px;resize:vertical}

/* ===== Connexion ===== */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,var(--side),#fff)}
.lbox{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 12px 40px #17406b1a;text-align:center}
.lbox h1{font-size:20px;margin:6px 0 2px;color:var(--ink)}
.lbox label{text-align:left}
.sous{color:var(--mut);font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.logo-img{display:block;width:150px;height:auto;margin:0 auto 8px;border-radius:12px}
.logo-img.gauche{width:130px;margin:0 0 4px 10px}
.logo{width:64px;height:64px;margin:0 auto 8px;border-radius:18px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:24px}
.logo.petit{width:40px;height:40px;border-radius:12px;font-size:16px;margin:0 0 4px 10px}
.champ-code{display:flex;gap:8px}
.champ-code input{flex:1;min-width:0}
.go{width:100%;margin-top:14px;padding:13px;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:800;font-size:15px}
.go:disabled{opacity:.6}
.err{color:var(--danger);font-size:13px;margin-top:10px;text-align:left;min-height:1.3em}
.err.info{color:var(--mut)}
.decompte{font-size:30px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;min-height:38px}

/* ===== Menu à gauche (tiroir sur téléphone, fixe sur ordinateur) ===== */
aside{position:fixed;top:0;bottom:0;left:0;width:260px;background:var(--side);padding:18px 12px;overflow-y:auto;z-index:30;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
body.open aside{transform:none;visibility:visible}
.ov{display:none;position:fixed;inset:0;background:#0007;z-index:20}
body.open .ov{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:4px;border-radius:12px;background:transparent;color:var(--ink);text-align:left;font-size:15px}
.mi:hover{background:#ffffff80}
.mi.on{background:#fff;font-weight:700;box-shadow:inset 3px 0 var(--gold)}
.mi.out{color:var(--danger);margin-top:10px}
a.mi{text-decoration:none}
.nb{margin-left:auto;min-width:24px;padding:2px 8px;border-radius:20px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;text-align:center}
.nb.pulse{animation:pulse .8s ease 4}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

/* ===== Barre du haut et bandeau ===== */
.top{position:sticky;top:0;z-index:10;height:var(--haut);display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.top b{flex:1;font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:18px}
.bandeau{position:sticky;top:var(--haut);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--gold);color:var(--ink);font-weight:700;font-size:14px;box-shadow:0 4px 12px #17406b22}
main{padding:16px 14px 50px;max-width:1000px;margin:auto;outline:none}
@media(min-width:900px){
  aside{transform:none;visibility:visible}
  .ov{display:none!important}
  .ib.m{display:none}
  #app{padding-left:260px}
}

/* ===== Cartes, boutons, listes ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px #17406b0d}
button.card{display:block;width:100%;text-align:left}
.n{font-size:30px;font-weight:800;color:var(--gold2);margin-top:6px;line-height:1.1}
.l{font-size:13px;color:var(--mut);margin-top:4px}
.card.urgent{border:2px solid var(--gold);background:#FFF9EC}
.card.urgent .n{color:var(--danger)}
h2.t{font-size:15px;color:var(--ink);margin:22px 0 10px}
.intro{color:var(--mut);margin-bottom:12px;font-size:14px}
.raccourcis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.btn.alt{background:var(--side)}
.btn.dng{background:#FDE8E8;color:var(--danger)}
.btn.ok,.btn.wa{background:#DDF3E8;color:#1d7a50}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btn.big{min-height:50px;font-size:15px;flex:1}
.btn:disabled{opacity:.55;cursor:not-allowed}
.puces{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.puce{min-height:44px;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--ink)}
.puce[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.outils{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.outils input{flex:1;min-width:0}
.liste{display:grid;gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 16px #17406b0d}
.item.prod{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.item.avec{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center}
.vign{width:76px;height:76px;border-radius:12px;overflow:hidden;background:#EAF3FC;display:grid;place-items:center;color:var(--gold2);font-weight:800}
.vign img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.prix{font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--mut)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--bg);font-size:12px;font-weight:700}
.pill.ok{background:#DDF3E8;color:#1d7a50}
.pill.bad{background:#FDE8E8;color:var(--danger)}
.pill.or{background:#FBF1D6;color:#8A6A12}
.pill.bleu{background:#E3EEFB;color:var(--ink)}
.resa{border:2px solid var(--gold);background:#FFFCF3}
.resa.fait{border:1px solid var(--line);background:#fff}
.entete{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.delai{font-weight:800;margin:4px 0 10px}
.delai.urgent{color:var(--danger)}
.infos{display:grid;gap:6px;font-size:14px;margin:0 0 12px}
.infos div{display:grid;grid-template-columns:100px 1fr;gap:8px}
.infos dt{color:var(--mut)}
.infos dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.contact,.decide{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.champ-statut{display:block;margin-top:12px}
.vide{text-align:center;color:var(--mut);padding:30px 10px}

/* ===== Interrupteurs et rubriques ===== */
.sw{position:relative;display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:14px;color:#1d2b3a}
.sw input{position:absolute;opacity:0;width:46px;height:26px;margin:0}
.slider{width:46px;height:26px;border-radius:20px;background:#c9d4e3;position:relative;flex:none;transition:background .2s}
.slider::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.sw input:checked+.slider{background:var(--gold2)}
.sw input:checked+.slider::after{transform:translateX(20px)}
.sw input:focus-visible+.slider{outline:3px solid var(--gold2);outline-offset:2px}
.rubriques{display:flex;flex-wrap:wrap;gap:8px}
.rub{min-height:44px;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;color:var(--ink)}
.rub[aria-checked=true]{background:var(--gold);border-color:var(--gold2)}

/* ===== Fenêtres ===== */
dialog{border:0;padding:0;border-radius:20px;width:min(94vw,520px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #0006;color:#1d2b3a}
dialog::backdrop{background:#17406b99}
.dlg{padding:20px}
.dlg h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.dlg p{margin:0}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.photo-zone{display:flex;gap:14px;align-items:center}
.apercu{width:96px;height:96px;border-radius:14px;overflow:hidden;background:#EAF3FC;display:grid;place-items:center;flex:none;color:var(--gold2);font-weight:800}
.apercu img{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== CONNEXION ===== -->
<div id="connexion" class="login">
  <form id="formConnexion" class="lbox" novalidate>
    <img class="logo-img" data-logo src="logo-conductrice-fashion.png" alt="Logo Conductrice Fashion">
    <h1>Espace administrateur</h1>
    <p class="sous">CONDUCTRICE FASHION</p>
    <label for="code">Code d’accès</label>
    <div class="champ-code">
      <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200">
      <button type="button" id="voirCode" class="btn alt" aria-pressed="false">Afficher</button>
    </div>
    <p id="msgConnexion" class="err" role="alert"></p>
    <p id="decompte" class="decompte" role="timer"></p>
    <button id="btnConnexion" class="go" type="submit">Se connecter</button>
  </form>
</div>

<!-- ===== ESPACE ADMIN ===== -->
<div id="app" class="hidden">
  <div id="voile" class="ov"></div>
  <aside id="menu" aria-label="Menu">
    <img class="logo-img gauche" data-logo src="logo-conductrice-fashion.png" alt="Logo Conductrice Fashion">
    <p class="muted" style="margin:0 0 12px 10px">Administration</p>
    <nav id="nav"></nav>
    <a class="mi" href="boutique.html" target="_blank" rel="noopener" style="margin-top:6px"><span aria-hidden="true">🌐</span><span>Voir la boutique</span></a>
  </aside>

  <div class="top">
    <button class="ib m" id="btnMenu" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    <b id="titre">Tableau de bord</b>
    <button class="ib" id="btnActualiser" aria-label="Actualiser">↻</button>
  </div>

  <div id="bandeau" class="bandeau hidden" role="status">
    <span id="bandeauTexte"></span>
    <button type="button" class="btn sm alt" id="bandeauBtn">Voir</button>
  </div>

  <main id="vue" tabindex="-1"></main>
</div>

<!-- ===== FENÊTRE PRODUIT ===== -->
<dialog id="dlgProduit" aria-labelledby="dlgTitre">
  <form id="formProduit" class="dlg" novalidate>
    <h2 id="dlgTitre">Ajouter un produit</h2>
    <input type="hidden" id="pId">

    <label id="lblPhoto">Photo</label>
    <div class="photo-zone">
      <div id="pApercu" class="apercu" aria-hidden="true"></div>
      <div>
        <input type="file" id="pFichier" accept="image/*" class="hidden" aria-labelledby="lblPhoto">
        <button type="button" class="btn alt" id="pChoisir">📷 Choisir une photo</button>
        <p class="muted" id="pPhotoInfo" style="margin-top:6px"></p>
      </div>
    </div>

    <label id="lblRub">Rubrique de la boutique *</label>
    <div id="pRubriques" class="rubriques" role="radiogroup" aria-labelledby="lblRub"></div>
    <label class="sw"><input type="checkbox" id="pAfricaine"><span class="slider"></span><span>Inspiration africaine</span></label>

    <label for="pNom">Nom du produit *</label>
    <input id="pNom" type="text" maxlength="200">

    <label for="pDescription">Description</label>
    <textarea id="pDescription" maxlength="2000"></textarea>

    <div class="deux">
      <div><label for="pPrix">Prix (FCFA) *</label><input id="pPrix" type="number" min="0" step="any" inputmode="decimal"></div>
      <div><label for="pStock">Stock</label><input id="pStock" type="number" min="0" step="1" inputmode="numeric" value="0"></div>
    </div>

    <label class="sw"><input type="checkbox" id="pActif" checked><span class="slider"></span><span>Visible dans la boutique</span></label>

    <p id="msgProduit" class="err" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn alt" id="pAnnuler">Annuler</button>
      <button type="submit" class="btn" id="pEnregistrer">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- ===== FENÊTRE DE CONFIRMATION ===== -->
<dialog id="dlgConfirm" aria-labelledby="confTitre">
  <div class="dlg">
    <h2 id="confTitre"></h2>
    <p id="confTexte"></p>
    <div class="dlg-actions">
      <button type="button" class="btn alt" id="confNon">Non</button>
      <button type="button" class="btn" id="confOui">Oui</button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>
<script>
'use strict';
(() => {
  /* ===== CONFIGURATION (mêmes valeurs que boutique.html) ===== */
  const CONFIG = {
    ENDPOINT: 'https://fra.cloud.appwrite.io/v1',
    PROJET: '6ad7761700274f3ae4b1',
    FONCTION: 'conductrice-backend',
    DEVISE: 'FCFA',
    MAX_VEDETTES: 4,
    DELAI_RESERVATION_H: 48,
    SONDAGE_MS: 60000,          // vérification des nouvelles réservations : 1 minute
    PHOTO_COTE_MAX: 1200,       // la photo est réduite à 1200 px au plus
    PHOTO_QUALITE: 0.85,
    CLE_SESSION: 'cf_admin_session',
    CLE_VERROU: 'cf_admin_verrou'
  };

  // [identifiant, icône, titre]
  const MENU = [
    ['accueil', '🏠', 'Tableau de bord'],
    ['reservations', '📅', 'Réservations'],
    ['commandes', '🛍️', 'Commandes'],
    ['produits', '👗', 'Produits'],
    ['vedettes', '⭐', 'Mise en avant sur l’accueil']
  ];

  // Rubriques de la boutique (mêmes identifiants que boutique.html)
  const RUBRIQUES = [
    ['ensemble_homme', 'Ensemble homme'], ['ensemble_femme', 'Ensemble femme'], ['robe', 'Robe'],
    ['accessoires_homme', 'Accessoires homme'], ['accessoires_femme', 'Accessoires femme']
  ];

  const STATUTS = {
    commandes: [['en_attente', 'En attente'], ['confirmee', 'Confirmée'], ['expediee', 'Expédiée'], ['livree', 'Livrée'], ['annulee', 'Annulée']],
    reservations: [['en_attente', 'En attente'], ['confirmee', 'Confirmée'], ['annulee', 'Annulée'], ['expiree', 'Expirée']]
  };

  /* ============================ Outils ============================ */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtNombre = (n) => new Intl.NumberFormat('fr-FR').format(Number(n) || 0);
  const fmtPrix = (n) => fmtNombre(n) + ' ' + CONFIG.DEVISE;
  const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }); };
  const pl = (n, singulier, pluriel) => n + ' ' + (n > 1 ? pluriel : singulier);
  const memeJour = (iso) => { const d = new Date(iso); return !isNaN(d) && d.toDateString() === new Date().toDateString(); };

  // Photo : seul un lien complet en https:// s’affiche dans la boutique.
  function urlSure(valeur) {
    const v = String(valeur || '').trim();
    if (!/^https:\/\//i.test(v)) return '';
    try { return new URL(v).href; } catch (e) { return ''; }
  }

  /* Rubrique d’un produit : mêmes règles que boutique.html
     (la catégorie enregistrée d’abord, sinon les mots-clés). */
  function rubriqueDe(p) {
    const choisie = String(p.categorie || '').trim();
    if (RUBRIQUES.some((r) => r[0] === choisie)) return choisie;
    const t = (String(p.nom || '') + ' ' + String(p.description || '')).toLocaleLowerCase('fr');
    const homme = /homme|masculin/.test(t);
    if (/sac|chaussure|bijou|accessoire|montre|lunette/.test(t)) return homme ? 'accessoires_homme' : 'accessoires_femme';
    if (/robe|jupe/.test(t)) return 'robe';
    if (/ensemble|complet|costume|tenue/.test(t)) return homme ? 'ensemble_homme' : 'ensemble_femme';
    return '';
  }
  function africaineDe(p) {
    if (String(p.categorie || '').trim()) return p.africaine === true;
    const t = (String(p.nom || '') + ' ' + String(p.description || '')).toLocaleLowerCase('fr');
    return /africain|africaine|wax|bogolan|kente|boubou|pagne/.test(t);
  }
  const libelleRubrique = (cle) => { const r = RUBRIQUES.find((x) => x[0] === cle); return r ? r[1] : 'Autre'; };

  const session = {
    lire() { try { return JSON.parse(sessionStorage.getItem(CONFIG.CLE_SESSION)); } catch (e) { return null; } },
    ecrire(v) { try { sessionStorage.setItem(CONFIG.CLE_SESSION, JSON.stringify(v)); } catch (e) { /* ignoré */ } },
    effacer() { try { sessionStorage.removeItem(CONFIG.CLE_SESSION); } catch (e) { /* ignoré */ } }
  };
  // Fin du blocage mémorisée pour l’affichage (le serveur reste maître).
  const verrouStock = {
    lire() { try { return Number(localStorage.getItem(CONFIG.CLE_VERROU)) || 0; } catch (e) { return 0; } },
    ecrire(fin) { try { localStorage.setItem(CONFIG.CLE_VERROU, String(fin)); } catch (e) { /* ignoré */ } },
    effacer() { try { localStorage.removeItem(CONFIG.CLE_VERROU); } catch (e) { /* ignoré */ } }
  };

  const etat = {
    jeton: '', fin: 0, section: 'accueil',
    produits: [], reservations: [], commandes: [], resaChargees: false,
    recherche: '', filtreResa: 'attente', filtreCmd: 'aujourdhui'
  };
  const vue = $('#vue');

  let tToast = null;
  function toast(texte) {
    const t = $('#toast');
    t.textContent = texte;
    t.style.display = 'block';
    clearTimeout(tToast);
    tToast = setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  /* ====================== Appel du backend ======================
     Toutes les actions passent par la fonction Appwrite : le code
     d’accès et les droits d’écriture ne sont jamais dans cette page. */
  async function appeler(action, donnees) {
    const corps = Object.assign({ action: action }, donnees || {});
    if (action !== 'admin_login') corps.jeton = etat.jeton;

    const ctrl = new AbortController();
    const delai = setTimeout(() => ctrl.abort(), 30000);
    let reponse, execution;
    try {
      reponse = await fetch(CONFIG.ENDPOINT + '/functions/' + CONFIG.FONCTION + '/executions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Appwrite-Project': CONFIG.PROJET },
        body: JSON.stringify({
          body: JSON.stringify(corps), async: false, path: '/', method: 'POST',
          headers: { 'content-type': 'application/json' }
        }),
        signal: ctrl.signal
      });
      execution = await reponse.json();
    } catch (e) {
      return { ok: false, message: 'Connexion impossible. Vérifie ta connexion Internet.' };
    } finally {
      clearTimeout(delai);
    }
    if (!reponse.ok) return { ok: false, message: (execution && execution.message) || 'Erreur du serveur.' };

    let rep;
    try { rep = JSON.parse(execution.responseBody); } catch (e) { rep = null; }
    if (!rep || typeof rep !== 'object') return { ok: false, message: 'Réponse inattendue du serveur. Réessaie.' };
    if (rep.expire) deconnecter('Session expirée. Reconnecte-toi.');
    return rep;
  }

  /* ============================ Connexion ============================ */
  const champCode = $('#code');
  const btnConnexion = $('#btnConnexion');
  const msgConnexion = $('#msgConnexion');
  const decompte = $('#decompte');
  let minuteurVerrou = null;

  function messageConnexion(texte, info) {
    msgConnexion.textContent = texte || '';
    msgConnexion.className = 'err' + (info ? ' info' : '');
  }
  function hms(s) {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return [h, m, x].map((n) => String(n).padStart(2, '0')).join(':');
  }
  function demarrerVerrou(fin) {
    verrouStock.ecrire(fin);
    champCode.disabled = true; btnConnexion.disabled = true; $('#voirCode').disabled = true;
    messageConnexion('Accès bloqué après plusieurs codes incorrects. Réessaie dans :');
    clearInterval(minuteurVerrou);
    const maj = () => {
      const reste = Math.ceil((fin - Date.now()) / 1000);
      if (reste <= 0) { finVerrou(); return; }
      decompte.textContent = hms(reste);
    };
    maj();
    minuteurVerrou = setInterval(maj, 1000);
  }
  function finVerrou() {
    clearInterval(minuteurVerrou);
    verrouStock.effacer();
    decompte.textContent = '';
    champCode.disabled = false; btnConnexion.disabled = false; $('#voirCode').disabled = false;
    messageConnexion('Tu peux réessayer.', true);
  }
  function verifierVerrou() {
    const fin = verrouStock.lire();
    if (fin > Date.now()) demarrerVerrou(fin); else verrouStock.effacer();
  }

  async function connecter(e) {
    e.preventDefault();
    const code = champCode.value;
    if (!code) { messageConnexion('Saisis ton code d’accès.'); return; }
    btnConnexion.disabled = true;
    messageConnexion('Vérification…', true);
    const r = await appeler('admin_login', { code: code });
    champCode.value = '';
    btnConnexion.disabled = false;

    if (r.ok && r.jeton) {
      etat.jeton = r.jeton;
      etat.fin = Date.now() + (Number(r.duree) || 3600) * 1000;
      session.ecrire({ jeton: etat.jeton, fin: etat.fin });
      verrouStock.effacer();
      messageConnexion('');
      entrerApp();
      return;
    }
    if (r.bloque) { demarrerVerrou(Date.now() + (Number(r.restant) || 0) * 1000); return; }
    if (r.essais_restants) {
      const n = r.essais_restants;
      messageConnexion('Code incorrect. Il te reste ' + n + ' essai' + (n > 1 ? 's' : '') + ' avant le blocage.');
    } else {
      messageConnexion(r.message || 'Connexion impossible.');
    }
    champCode.focus();
  }

  function entrerApp() {
    $('#connexion').classList.add('hidden');
    $('#app').classList.remove('hidden');
    construireMenu();
    ouvrirSection('accueil');
  }

  function deconnecter(texte) {
    etat.jeton = ''; etat.fin = 0; etat.resaChargees = false;
    etat.produits = []; etat.reservations = []; etat.commandes = [];
    session.effacer();
    ['dlgProduit', 'dlgConfirm'].forEach((id) => { const d = $('#' + id); if (d.open) d.close(); });
    fermerMenu();
    $('#app').classList.add('hidden');
    $('#connexion').classList.remove('hidden');
    document.title = 'Administration · Conductrice Fashion';
    messageConnexion(texte || '', true);
    verifierVerrou();
  }

  /* ============================== Menu ============================== */
  function ouvrirMenu() { document.body.classList.add('open'); $('#btnMenu').setAttribute('aria-expanded', 'true'); }
  function fermerMenu() { document.body.classList.remove('open'); $('#btnMenu').setAttribute('aria-expanded', 'false'); }

  function construireMenu() {
    $('#nav').innerHTML = MENU.map((m) =>
      '<button class="mi' + (m[0] === etat.section ? ' on' : '') + '" data-sec="' + m[0] + '">' +
      '<span aria-hidden="true">' + m[1] + '</span><span>' + m[2] + '</span>' +

  /* ====================== Chargement des données ====================== */
  async function charger(table) {
    const r = await appeler('admin_liste', { table: table });
    if (!r.ok) throw new Error(r.message || 'Chargement impossible.');
    etat[table] = Array.isArray(r.lignes) ? r.lignes : [];
    if (table === 'reservations') etat.resaChargees = true;
  }

  async function ouvrirSection(nom) {
    if (!etat.jeton) return;
    etat.section = nom;
    $('#titre').textContent = MENU.find((m) => m[0] === nom)[2];
    $$('.mi[data-sec]').forEach((b) => b.classList.toggle('on', b.dataset.sec === nom));
    fermerMenu();
    vue.innerHTML = '<p class="vide" role="status">Chargement…</p>';
    window.scrollTo(0, 0);
    try {
      if (nom === 'accueil') await Promise.all([charger('produits'), charger('reservations'), charger('commandes')]);
      else if (nom === 'produits' || nom === 'vedettes') await charger('produits');
      else await charger(nom);
    } catch (err) {
      if (etat.jeton && etat.section === nom) erreurVue(err.message);
      return;

    if (etat.jeton && etat.section === nom) { rendre(); vue.focus({ preventScroll: true }); }

    switch (etat.section) {
      case 'accueil': return vueAccueil();

      case 'produits': return vueProduits();

  async function sonder() {
    if (!etat.jeton || document.hidden) return;
    const avant = nbAttente();
    const dejaCharge = etat.resaChargees;
    const r = await appeler('admin_liste', { table: 'reservations' });
    if (!r.ok || !etat.jeton) return;
    etat.reservations = Array.isArray(r.lignes) ? r.lignes : [];
    etat.resaChargees = true;
    const apres = nbAttente();
    majIndicateurs();
    if (dejaCharge && apres > avant) {
      toast('🔔 Nouvelle réservation à traiter !');
      const nb = $('#nbResa');
      if (nb) { nb.classList.remove('pulse'); void nb.offsetWidth; nb.classList.add('pulse'); }
    }
    if (apres !== avant) {
      const select = document.activeElement && document.activeElement.tagName === 'SELECT';
      if (etat.section === 'reservations' && !select) vueReservations();

    const h = Math.floor(reste / 3600000), m = Math.floor((reste % 3600000) / 60000);

  // Réduit la photo (1200 px au plus, JPEG) et renvoie son contenu en base64.
  async function reduirePhoto(fichier) {
    if (!/^image\//.test(fichier.type)) throw new Error('Choisis une image (photo).');
    let source = null, largeur = 0, hauteur = 0;
    if (window.createImageBitmap) {
      try { source = await createImageBitmap(fichier); largeur = source.width; hauteur = source.height; } catch (e) { source = null; }
    }
    if (!source) {
      const lien = await new Promise((ok, ko) => {
        const lecteur = new FileReader();
        lecteur.onload = () => ok(lecteur.result);
        lecteur.onerror = () => ko(new Error('Photo illisible.'));
        lecteur.readAsDataURL(fichier);
      });
      source = await new Promise((ok, ko) => {
        const img = new Image();
        img.onload = () => ok(img);
        img.onerror = () => ko(new Error('Photo illisible. Essaie une photo JPEG ou PNG.'));
        img.src = lien;
      });
      largeur = source.naturalWidth; hauteur = source.naturalHeight;
    }
    const ratio = Math.min(1, CONFIG.PHOTO_COTE_MAX / Math.max(largeur, hauteur));
    const w = Math.max(1, Math.round(largeur * ratio)), h = Math.max(1, Math.round(hauteur * ratio));
    const toile = document.createElement('canvas');
    toile.width = w; toile.height = h;
    const ctx = toile.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(source, 0, 0, w, h);
    if (source.close) source.close();
    let qualite = CONFIG.PHOTO_QUALITE, data = '';
    for (let i = 0; i < 4; i++) {
      data = toile.toDataURL('image/jpeg', qualite);
      if (data.length * 0.75 < 2500000) break;
      qualite -= 0.15;
    }
    return data.split(',')[1];
  }

  async function choisirPhoto(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const info = $('#pPhotoInfo');
    info.textContent = 'Préparation de la photo…';
    try {
      const base64 = await reduirePhoto(f);
      formulaire.photoBase64 = base64;
      afficherApercu('data:image/jpeg;base64,' + base64);
      info.textContent = 'Photo prête (' + Math.round(base64.length * 0.75 / 1024) + ' Ko). Elle sera envoyée à l’enregistrement.';
    } catch (err) {
      info.textContent = err.message || 'Photo illisible.';
    }
    e.target.value = '';
  }

  async function enregistrerProduit(e) {
    e.preventDefault();
    const msg = $('#msgProduit');
    msg.textContent = '';
    const nom = $('#pNom').value.trim();
    const prixTexte = $('#pPrix').value.trim();
    const prix = Number(prixTexte);
    if (!nom) { msg.textContent = 'Écris le nom du produit.'; return; }
    if (!formulaire.rubrique) { msg.textContent = 'Choisis une rubrique (Ensemble, Robe, Accessoires…).'; return; }
    if (prixTexte === '' || !(prix >= 0)) { msg.textContent = 'Indique un prix valide.'; return; }
    const stock = parseInt($('#pStock').value || '0', 10);

    const bouton = $('#pEnregistrer');
    bouton.disabled = true;
    try {
      // 1) Envoi de la nouvelle photo (si une photo a été choisie)
      if (formulaire.photoBase64) {
        $('#pPhotoInfo').textContent = 'Envoi de la photo…';
        const envoi = await appeler('admin_photo', { contenu: formulaire.photoBase64 });
        if (!envoi.ok) throw new Error(envoi.message || 'Envoi de la photo impossible.');
        formulaire.photoUrl = envoi.url;
        formulaire.photoBase64 = '';
        $('#pPhotoInfo').textContent = 'Photo envoyée.';
      }
      // 2) Enregistrement du produit
      const charge = {
        nom: nom,
        description: $('#pDescription').value.trim(),
        prix: prix,
        stock: isNaN(stock) || stock < 0 ? 0 : stock,
        actif: $('#pActif').checked,
        categorie: formulaire.rubrique,
        africaine: $('#pAfricaine').checked
      };
      if (formulaire.photoUrl) charge.photo_url = formulaire.photoUrl;
      const id = $('#pId').value;
      if (id) charge.id = id;
      const r = await appeler('admin_produit', charge);
      if (!r.ok) throw new Error(r.message || 'Enregistrement impossible.');

      $('#dlgProduit').close();
      toast('✅ ' + (r.message || 'Produit enregistré.'));
      await charger('produits');
      if (etat.section === 'produits') vueProduits();
      else if (etat.section === 'vedettes') vueVedettes();
    } catch (err) {
      msg.textContent = err.message || 'Enregistrement impossible.';
    } finally {
      bouton.disabled = false;
    }
  }

  async function supprimerProduit(id) {
    const p = etat.produits.find((x) => x.id === id);
    if (!p) return;
    const oui = await confirmer('Supprimer « ' + (p.nom || 'ce produit') + ' » ?', 'Cette action est définitive.');
    if (!oui) return;
    const r = await appeler('admin_produit_supprimer', { id: id });
    if (!r.ok) { toast(r.message || 'Suppression impossible.'); return; }
    etat.produits = etat.produits.filter((x) => x.id !== id);
    listeProduits();
    toast('Produit supprimé.');
  }

  function confirmer(titre, texte) {
    return new Promise((resolve) => {
      const d = $('#dlgConfirm');
      $('#confTitre').textContent = titre;
      $('#confTexte').textContent = texte;
      const fin = (v) => { d.oncancel = null; d.close(); resolve(v); };
      $('#confOui').onclick = () => fin(true);
      $('#confNon').onclick = () => fin(false);
      d.oncancel = () => { d.oncancel = null; resolve(false); };
      d.showModal();
    });
  }

  /* ================= 5. Mise en avant sur l’accueil ================= */
  function itemVedette(p, enVedette) {
    return '<article class="item avec">' + vignette(p) +
      '<div><h3>' + esc(p.nom) + '</h3><p class="prix">' + fmtPrix(p.prix) + '</p>' +
      (p.actif === true ? '' : '<p class="meta"><span class="pill bad">Masqué dans la boutique</span></p>') + '</div>' +
      '<button class="btn sm ' + (enVedette ? 'dng' : '') + '" data-action="vedette" data-id="' + esc(p.id) + '" data-valeur="' + (enVedette ? 'non' : 'oui') + '">' +
        (enVedette ? 'Retirer' : '⭐ Mettre en avant') + '</button></article>';
  }
  function vueVedettes() {
    const choisis = etat.produits.filter((p) => p.vedette === true);
    const autres = etat.produits.filter((p) => p.vedette !== true && p.actif === true);
    const plein = choisis.length >= CONFIG.MAX_VEDETTES;
    vue.innerHTML =
      '<p class="intro">Choisis jusqu’à ' + CONFIG.MAX_VEDETTES + ' produits à montrer sur la page d’accueil.</p>' +
      '<p style="font-size:17px;margin-bottom:6px"><strong>' + choisis.length + '</strong> / ' + CONFIG.MAX_VEDETTES + ' produits en avant</p>' +
      '<h2 class="t">Sur l’accueil maintenant</h2>' +
      '<div class="liste">' + (choisis.length ? choisis.map((p) => itemVedette(p, true)).join('') : '<p class="vide">Aucun produit en avant.</p>') + '</div>' +
      '<h2 class="t">Ajouter à l’accueil</h2>' +
      (plein ? '<p class="intro">Retire d’abord un produit pour en ajouter un autre.</p>' : '') +
      '<div class="liste">' + (autres.length ? autres.map((p) => itemVedette(p, false)).join('') : '<p class="vide">Aucun autre produit visible dans la boutique.</p>') + '</div>';
    if (plein) $$('[data-action="vedette"][data-valeur="oui"]').forEach((b) => { b.disabled = true; });
  }
  async function basculerVedette(id, valeur, bouton) {
    const p = etat.produits.find((x) => x.id === id);
    if (!p) return;
    bouton.disabled = true;
    const r = await appeler('admin_produit', { id: id, vedette: valeur });
    if (!r.ok) { bouton.disabled = false; toast(r.message || 'Action impossible.'); return; }
    p.vedette = valeur;
    vueVedettes();
    toast(valeur ? '⭐ Ajouté à l’accueil.' : 'Retiré de l’accueil.');
  }

  /* ============================ Évènements ============================ */
  vue.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const id = b.dataset.id;
    switch (b.dataset.action) {
      case 'aller': ouvrirSection(b.dataset.cible); break;
      case 'ajouter-rapide': await ouvrirSection('produits'); ouvrirFormulaire(null); break;
      case 'ajouter': ouvrirFormulaire(null); break;
      case 'modifier': ouvrirFormulaire(etat.produits.find((p) => p.id === id)); break;
      case 'supprimer': supprimerProduit(id); break;
      case 'vedette': basculerVedette(id, b.dataset.valeur === 'oui', b); break;
      case 'filtreResa': etat.filtreResa = b.dataset.valeur; vueReservations(); break;
      case 'filtreCmd': etat.filtreCmd = b.dataset.valeur; vueCommandes(); break;
      case 'rafraichir': ouvrirSection(etat.section); break;
      case 'statut': {
        if (b.dataset.valeur === 'annulee' && !(await confirmer('Annuler cette réservation ?', 'La cliente ne sera pas prévenue automatiquement.'))) return;
        b.disabled = true;
        const ok = await majStatut(b.dataset.table, id, b.dataset.valeur);
        if (!ok) b.disabled = false;
        break;
      }
    }
  });
  vue.addEventListener('change', async (e) => {
    const t = e.target;
    if (!t.matches('select[data-statut]')) return;
    t.disabled = true;
    const ok = await majStatut(t.dataset.table, t.dataset.id, t.value);
    t.disabled = false;
    if (!ok) t.value = t.dataset.ancien;
  });
  vue.addEventListener('input', (e) => {
    if (e.target.id === 'recherche') { etat.recherche = e.target.value; listeProduits(); }
  });

  // Image introuvable : le logo ou la photo est remplacé par le monogramme CF.
  document.addEventListener('error', (e) => {
    const t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    const s = document.createElement('span');
    if (t.hasAttribute('data-logo')) s.className = 'logo' + (t.classList.contains('gauche') ? ' petit' : '');
    s.textContent = 'CF';
    s.setAttribute('aria-hidden', 'true');
    t.replaceWith(s);
  }, true);

  $('#formConnexion').addEventListener('submit', connecter);
  $('#voirCode').addEventListener('click', (e) => {
    const visible = champCode.type === 'password';
    champCode.type = visible ? 'text' : 'password';
    e.currentTarget.textContent = visible ? 'Masquer' : 'Afficher';
    e.currentTarget.setAttribute('aria-pressed', String(visible));
  });
  $('#btnMenu').addEventListener('click', ouvrirMenu);
  $('#voile').addEventListener('click', fermerMenu);
  $('#btnActualiser').addEventListener('click', () => ouvrirSection(etat.section));
  $('#bandeauBtn').addEventListener('click', () => { etat.filtreResa = 'attente'; ouvrirSection('reservations'); });
  $('#nav').addEventListener('click', (e) => {
    if (e.target.closest('#btnSortir')) { deconnecter('Tu es déconnectée.'); return; }
    const b = e.target.closest('[data-sec]');
    if (b) ouvrirSection(b.dataset.sec);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerMenu(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sonder(); });

  $('#formProduit').addEventListener('submit', enregistrerProduit);
  $('#pAnnuler').addEventListener('click', () => $('#dlgProduit').close());
  $('#pChoisir').addEventListener('click', () => $('#pFichier').click());
  $('#pFichier').addEventListener('change', choisirPhoto);
  $('#pRubriques').addEventListener('click', (e) => {
    const b = e.target.closest('.rub');
    if (b) choisirRubrique(b.dataset.val);
  });

  /* ============================ Démarrage ============================ */
  function init() {
    construireRubriques();
    const s = session.lire();
    if (s && s.jeton && s.fin > Date.now()) {
      etat.jeton = s.jeton; etat.fin = s.fin;
      entrerApp();
    } else {
      session.effacer();
      verifierVerrou();
    }
    // Déconnexion automatique à la fin de la session (1 h).
    setInterval(() => { if (etat.jeton && Date.now() > etat.fin) deconnecter('Session expirée. Reconnecte-toi.'); }, 15000);
    // Vérification des nouvelles réservations.
    setInterval(sonder, CONFIG.SONDAGE_MS);
    // Mise à jour du délai restant des réservations en attente.
    setInterval(() => {
      $$('.delai[data-cree]').forEach((el) => {
        const d = delaiInfo(el.dataset.cree);
        el.textContent = '⏳ ' + d.texte;
        el.classList.toggle('urgent', d.urgent);
      });
    }, 30000);
  }
  init();
})();
</script>
</body>
</html>
