<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discussion – Jupiter IA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2334D399'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='700' text-anchor='middle' fill='%23064E3B' font-family='Arial'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="app-chat" id="application" aria-busy="true">

    <!-- Tiroir : historique des conversations -->
    <aside class="tiroir" id="tiroir" aria-label="Historique des conversations">
      <div class="tiroir-tete">
        <a class="logo" href="index.html" aria-label="Jupiter IA, accueil">
          <span class="logo-pastille" aria-hidden="true">J</span> Jupiter IA
        </a>
        <button type="button" class="bouton bouton-secondaire bouton-petit bouton-menu" id="fermer-tiroir" aria-label="Fermer l'historique">✕</button>
      </div>
      <div style="padding:12px 12px 0">
        <button type="button" class="bouton bouton-principal bouton-bloc" id="nouvelle-conv">+ Nouvelle conversation</button>
      </div>
      <nav class="liste-conv" id="liste-conv" aria-label="Tes conversations"></nav>
      <div class="tiroir-pied">
        <p class="discret" id="nom-utilisateur"></p>
        <a class="bouton bouton-secondaire bouton-petit" href="compte.html">Mon compte</a>
        <a class="bouton bouton-secondaire bouton-petit cache" id="lien-admin" href="admin.html">Administration</a>
        <button type="button" class="bouton bouton-danger bouton-petit" id="deconnexion">Se déconnecter</button>
      </div>
    </aside>
    <div class="voile cache" id="voile"></div>

    <!-- Zone de discussion -->
    <main class="zone-chat">
      <div class="barre-chat">
        <button type="button" class="bouton bouton-secondaire bouton-petit bouton-menu" id="bouton-menu"
                aria-controls="tiroir" aria-expanded="false">☰ Historique</button>
        <span class="titre-conv" id="titre-conv">Nouvelle conversation</span>
      </div>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Messages de la conversation">
        <div class="messages-interieur" id="messages-interieur"></div>
      </div>

      <div class="saisie">
        <form class="saisie-interieur" id="formulaire" autocomplete="off">
          <label for="champ" class="cache">Ton message</label>
          <textarea id="champ" rows="1" maxlength="2000" placeholder="Pose ta question à Jupiter IA…" required></textarea>
          <button type="submit" class="bouton bouton-principal" id="envoyer">Envoyer</button>
        </form>
        <p class="note-saisie" id="note-saisie">Jupiter IA peut se tromper. Vérifie les informations importantes.</p>
      </div>
    </main>
  </div>

  <!-- SDK Appwrite (version fixe) puis fonctions communes de Jupiter IA -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@18.2.0"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      "use strict";

      var $ = function (id) { return document.getElementById(id); };
      var tiroir = $("tiroir"), voile = $("voile"), listeConv = $("liste-conv");
      var messages = $("messages"), interieur = $("messages-interieur");
      var champ = $("champ"), boutonEnvoyer = $("envoyer"), titreConv = $("titre-conv");
      var note = $("note-saisie"), boutonMenu = $("bouton-menu");

      // État de la page
      var etat = { utilisateur: null, convId: "", envoi: false, conversations: [] };
      var mobile = window.matchMedia("(max-width: 959px)");
      var tactile = window.matchMedia("(pointer: coarse)");

      var SUGGESTIONS = [
        "Comment lancer un petit commerce avec 50 000 FCFA ?",
        "Donne-moi 10 idées de vidéos TikTok pour ma boutique",
        "Explique-moi la photosynthèse simplement",
        "Aide-moi à écrire un message pour un client"
      ];

      /* ---------- Tiroir (historique) ---------- */
      function majTiroir() {
        var ouvert = tiroir.classList.contains("ouvert");
        tiroir.inert = mobile.matches && !ouvert;  // inaccessible au clavier quand il est caché
        boutonMenu.setAttribute("aria-expanded", ouvert ? "true" : "false");
        voile.classList.toggle("cache", !(ouvert && mobile.matches));
      }
      function ouvrirTiroir() { tiroir.classList.add("ouvert"); majTiroir(); }
      function fermerTiroir() { tiroir.classList.remove("ouvert"); majTiroir(); }
      boutonMenu.addEventListener("click", ouvrirTiroir);
      $("fermer-tiroir").addEventListener("click", fermerTiroir);
      voile.addEventListener("click", fermerTiroir);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") fermerTiroir(); });
      if (mobile.addEventListener) mobile.addEventListener("change", majTiroir);

      /* ---------- Affichage des messages ---------- */
      function defiler() { messages.scrollTop = messages.scrollHeight; }

      // role : "user" ou "ia" ; source : "connaissance", "internet" ou "gemini"
      function ajouterBulle(role, texte, source) {
        var bulle = document.createElement("div");
        bulle.className = "bulle " + (role === "user" ? "bulle-user" : "bulle-ia");
        if (role === "user") {
          bulle.textContent = texte;
        } else {
          bulle.innerHTML = JIA.formater(texte);  // texte échappé avant mise en forme
          var etiquette = null;
          if (source === "connaissance") etiquette = "Réponse issue de la base de connaissances de Jupiter IA";
          if (source === "internet") etiquette = "Réponse enrichie par une recherche Internet";
          if (etiquette) {
            var span = document.createElement("span");
            span.className = "etiquette-source";
            span.textContent = etiquette;
            bulle.appendChild(span);
          }
        }
        interieur.appendChild(bulle);
        defiler();
        return bulle;
      }

      function ajouterAttente() {
        var bulle = document.createElement("div");
        bulle.className = "bulle bulle-ia";
        bulle.setAttribute("aria-label", "Jupiter IA réfléchit");
        bulle.innerHTML = '<span class="points"><span></span><span></span><span></span></span>';
        interieur.appendChild(bulle);
        defiler();
        return bulle;
      }

      function ajouterErreur(texte) {
        var zone = document.createElement("div");
        zone.className = "alerte alerte-erreur";
        zone.setAttribute("role", "alert");
        zone.textContent = texte;
        interieur.appendChild(zone);
        defiler();
      }

      function majRestants(n) {
        if (typeof n !== "number") return;
        note.textContent = "Il te reste " + n + " message" + (n > 1 ? "s" : "") +
          " aujourd'hui. Jupiter IA peut se tromper : vérifie les informations importantes.";
      }

      /* ---------- Écran d'accueil de la discussion ---------- */
      function afficherAccueil() {
        var prenom = ((etat.utilisateur && etat.utilisateur.name) || "").split(" ")[0];
        var bloc = document.createElement("div");
        bloc.className = "accueil-chat";
        bloc.id = "accueil";
        var titre = document.createElement("h2");
        titre.textContent = prenom ? "Bonjour " + prenom + " !" : "Bonjour !";
        var texte = document.createElement("p");
        texte.textContent = "Comment puis-je t'aider aujourd'hui ?";
        var liste = document.createElement("div");
        liste.className = "suggestions";
        SUGGESTIONS.forEach(function (s) {
          var bouton = document.createElement("button");
          bouton.type = "button";
          bouton.className = "suggestion";
          bouton.textContent = s;
          bouton.addEventListener("click", function () { envoyer(s); });
          liste.appendChild(bouton);
        });
        bloc.appendChild(titre); bloc.appendChild(texte); bloc.appendChild(liste);
        interieur.appendChild(bloc);
      }
      function masquerAccueil() { var a = $("accueil"); if (a) a.remove(); }

      /* ---------- Liste des conversations ---------- */
      function afficherConversations() {
        listeConv.textContent = "";
        if (!etat.conversations.length) {
          var vide = document.createElement("p");
          vide.className = "discret";
          vide.style.padding = "10px";
          vide.textContent = "Aucune conversation pour l'instant.";
          listeConv.appendChild(vide);
          return;
        }
        etat.conversations.forEach(function (c) {
          var ligne = document.createElement("div");
          ligne.className = "conv" + (c.id === etat.convId ? " active" : "");
          var titre = document.createElement("button");
          titre.type = "button";
          titre.className = "titre";
          titre.textContent = c.titre || "Nouvelle conversation";
          titre.addEventListener("click", function () { ouvrirConversation(c.id); });
          var suppr = document.createElement("button");
          suppr.type = "button";
          suppr.className = "suppr";
          suppr.textContent = "✕";
          suppr.setAttribute("aria-label", "Supprimer la conversation : " + (c.titre || "sans titre"));
          suppr.addEventListener("click", function () { supprimerConversation(c); });
          ligne.appendChild(titre); ligne.appendChild(suppr);
          listeConv.appendChild(ligne);
        });
      }

      async function chargerConversations() {
        var reponse = await JIA.appeler("conversations_list");
        etat.conversations = reponse.conversations || [];
        afficherConversations();
      }

      async function ouvrirConversation(id) {
        if (etat.envoi) return;
        try {
          var reponse = await JIA.appeler("conversation_get", { conversation_id: id });
          etat.convId = id;
          interieur.textContent = "";
          reponse.messages.forEach(function (m) {
            ajouterBulle(m.role === "user" ? "user" : "ia", m.contenu, m.source);
          });
          titreConv.textContent = reponse.titre || "Conversation";
          afficherConversations();
          fermerTiroir();
          defiler();
        } catch (erreur) {
          ajouterErreur(erreur.message);
        }
      }

      function nouvelleConversation() {
        if (etat.envoi) return;
        etat.convId = "";
        interieur.textContent = "";
        afficherAccueil();
        titreConv.textContent = "Nouvelle conversation";
        afficherConversations();
        fermerTiroir();
        champ.focus();
      }

      async function supprimerConversation(c) {
        if (etat.envoi) return;
        if (!window.confirm("Supprimer cette conversation ? Cette action est définitive.")) return;
        try {
          await JIA.appeler("conversation_delete", { conversation_id: c.id });
          etat.conversations = etat.conversations.filter(function (x) { return x.id !== c.id; });
          if (c.id === etat.convId) nouvelleConversation(); else afficherConversations();
        } catch (erreur) {
          ajouterErreur(erreur.message);
        }
      }

      /* ---------- Envoi d'un message ---------- */
      // Propose la recherche Internet quand Jupiter IA ne peut pas connaître la réponse
      function afficherProposition(texte) {
        var carte = document.createElement("div");
        carte.className = "proposition";
        var question = document.createElement("p");
        question.textContent = "Cette question demande une information récente. Veux-tu que Jupiter IA cherche sur Internet ?";
        var actions = document.createElement("div");
        actions.className = "actions";
        var oui = document.createElement("button");
        oui.type = "button"; oui.className = "bouton bouton-principal bouton-petit"; oui.textContent = "Oui, chercher";
        var non = document.createElement("button");
        non.type = "button"; non.className = "bouton bouton-secondaire bouton-petit"; non.textContent = "Non merci";
        oui.addEventListener("click", function () { carte.remove(); envoyer(texte, { recherche: true }); });
        non.addEventListener("click", function () {
          question.textContent = "D'accord, aucune recherche n'est lancée. Tu peux reformuler ta question ou en poser une autre.";
          actions.remove();
        });
        actions.appendChild(oui); actions.appendChild(non);
        carte.appendChild(question); carte.appendChild(actions);
        interieur.appendChild(carte);
        defiler();
      }

      async function envoyer(texte, options) {
        options = options || {};
        texte = (texte || "").trim();
        if (!texte || etat.envoi) return;
        etat.envoi = true;
        boutonEnvoyer.disabled = true;
        masquerAccueil();
        var bulleUtilisateur = options.recherche ? null : ajouterBulle("user", texte);
        if (!options.recherche) { champ.value = ""; champ.style.height = "auto"; }
        var attente = ajouterAttente();
        try {
          var reponse = await JIA.appeler("chat", {
            message: texte,
            conversation_id: etat.convId,
            recherche: !!options.recherche
          });
          attente.remove();
          var nouvelle = !etat.convId;
          etat.convId = reponse.conversation_id;
          if (reponse.propose_recherche) {
            afficherProposition(texte);
          } else {
            ajouterBulle("ia", reponse.reponse, reponse.source);
            majRestants(reponse.messages_restants);
          }
          if (nouvelle) {
            await chargerConversations();
            var courante = etat.conversations.filter(function (c) { return c.id === etat.convId; })[0];
            titreConv.textContent = (courante && courante.titre) || "Conversation";
          }
        } catch (erreur) {
          attente.remove();
          // Le message n'a pas été traité : on le remet dans la zone de saisie pour ne rien perdre
          if (bulleUtilisateur) { bulleUtilisateur.remove(); if (!champ.value) champ.value = texte; }
          ajouterErreur(erreur.message);
        } finally {
          etat.envoi = false;
          boutonEnvoyer.disabled = false;
        }
      }

      /* ---------- Saisie ---------- */
      $("formulaire").addEventListener("submit", function (e) {
        e.preventDefault();
        envoyer(champ.value);
      });
      champ.addEventListener("input", function () {
        champ.style.height = "auto";
        champ.style.height = Math.min(champ.scrollHeight, 160) + "px";
      });
      champ.addEventListener("keydown", function (e) {
        // Sur ordinateur : Entrée envoie, Maj+Entrée va à la ligne. Sur téléphone : Entrée va à la ligne.
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !tactile.matches) {
          e.preventDefault();
          envoyer(champ.value);
        }
      });

      $("nouvelle-conv").addEventListener("click", nouvelleConversation);
      $("deconnexion").addEventListener("click", function () { JIA.deconnecter(); });

      /* ---------- Démarrage ---------- */
      (async function demarrer() {
        var utilisateur = await JIA.exigerConnexion();
        if (!utilisateur) return;  // redirigé vers la connexion
        etat.utilisateur = utilisateur;
        $("nom-utilisateur").textContent = utilisateur.name || utilisateur.email;
        if (JIA.estAdmin(utilisateur)) $("lien-admin").classList.remove("cache");
        afficherAccueil();
        majTiroir();
        $("application").removeAttribute("aria-busy");
        try { await chargerConversations(); }
        catch (erreur) { ajouterErreur("Impossible de charger l'historique : " + erreur.message); }
      })();
    })();
  </script>
</body>
</html>
